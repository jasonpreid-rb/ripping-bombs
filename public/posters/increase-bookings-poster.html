<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ripping Bombs — Venue Poster</title>
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #4a4a4a;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }

  /* Poster is sized to true A4 physical dimensions (210mm x 297mm),
     matching the source PNG's 1240x1754px @ 150dpi exactly. */
  #poster {
    position: relative;
    width: 210mm;
    height: 297mm;
    background-image: url('/posters/venue-poster-bg.png');
    background-size: 210mm 297mm;
    background-repeat: no-repeat;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  /* QR placement verified against the actual design: blank region
     x:0-470px, y:1250-1620px on the 1240x1754px source, left-aligned
     to the design's consistent 37px margin. Converted to mm at 150dpi
     (1px = 25.4/150mm) so it lines up regardless of print scaling. */
  #qr {
    position: absolute;
    left: 6.26mm;
    top: 218.4mm;
    width: 57.6mm;
    height: 57.6mm;
  }

  @media print {
    html, body { background: none; }
    #poster { box-shadow: none; }
  }
</style>
</head>
<body>

  <div id="poster">
    <!-- Generic marketing QR — always points to /register, not venue-specific.
         For a real venue's personalized poster with their own auto-connect
         QR code, use /api/poster/[venueId] instead (see pages/venue-qr.jsx). -->
    <img id="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://www.rippingbombs.com/register&margin=0" alt="Scan to register on Ripping Bombs">
  </div>

</body>
</html>
